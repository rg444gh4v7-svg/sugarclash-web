<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Clash · Color que vuelve</title><style>/* EXPEDITION_STYLE_START — Dulcelandia's route, 22 October 2026. */
.expedition-home{max-width:1300px;margin:auto;padding:21px 38px 38px}

.expedition-daily .eyebrow{display:block;font-size:8px;letter-spacing:.13em}
