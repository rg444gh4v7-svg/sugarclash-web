<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
<title>Sugar Clash · confitería de restauración</title>
<desc>Atlas original de ocho piezas en cuatro columnas y dos filas. Bombón rosa, oso verde, rombo azul, piruleta dorada, espiral violeta, corazón coral, estrella crema y chocolate.</desc>
<defs>
  <linearGradient id="sc-r-pink" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#e6a8b8"/><stop offset=".55" stop-color="#cf8da3"/><stop offset="1" stop-color="#ba748e"/></linearGradient>
  <linearGradient id="sc-r-green" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#b4c78a"/><stop offset=".5" stop-color="#91aa6b"/><stop offset="1" stop-color="#748c58"/></linearGradient>
  <linearGradient id="sc-r-blue" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#b4cfd6"/><stop offset=".5" stop-color="#83afbf"/><stop offset="1" stop-color="#608fa4"/></linearGradient>
  <linearGradient id="sc-r-gold" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#ead19c"/><stop offset=".5" stop-color="#d6b371"/><stop offset="1" stop-color="#b99552"/></linearGradient>
  <linearGradient id="sc-r-violet" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#c2b1cb"/><stop offset=".5" stop-color="#a08aaf"/><stop offset="1" stop-color="#806c91"/></linearGradient>
  <linearGradient id="sc-r-coral" x1=".15" y1="0" x2=".8" y2="1"><stop stop-color="#e6aa95"/><stop offset=".5" stop-color="#ce846f"/><stop offset="1" stop-color="#b66a59"/></linearGradient>
  <linearGradient id="sc-r-cream" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#eee0bb"/><stop offset=".5" stop-color="#dcc99e"/><stop offset="1" stop-color="#bfa978"/></linearGradient>
  <linearGradient id="sc-r-teal" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#9cbbb0"/><stop offset="1" stop-color="#598b87"/></linearGradient>
  <linearGradient id="sc-r-cocoa" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#ac8a6d"/><stop offset=".45" stop-color="#8a654f"/><stop offset="1" stop-color="#674935"/></linearGradient>
  <pattern id="sc-r-sugar" width="17" height="19" patternUnits="userSpaceOnUse">
    <path d="m3 4 2-1m7 8 1 2m-10 4 2 1" stroke="#fff1d3" stroke-opacity=".17" stroke-width="1.2" stroke-linecap="round"/>
    <path d="m10 2 1 1M6 12h1" stroke="#473f3b" stroke-opacity=".1" stroke-width="1" stroke-linecap="round"/>
  </pattern>
  <path id="sc-r-bonbon" d="M-77-43C-48-70 41-71 76-42C101-20 99 24 75 46C42 74-44 73-77 45C-101 25-103-20-77-43Z"/>
  <clipPath id="sc-r-bonbon-clip"><use href="#sc-r-bonbon"/></clipPath>
