<!-- 2 · rombo de azúcar opaca, cortes suaves -->
<g transform="translate(640)" stroke-linejoin="round">
  <use href="#sc-r-diamond" transform="translate(0 4)" fill="#4c6e7d" stroke="#354f5c" stroke-width="3"/>
  <use href="#sc-r-diamond" fill="url(#sc-r-blue)" stroke="#456775" stroke-width="3"/>
