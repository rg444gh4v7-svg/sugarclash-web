  </g>
  <path d="M88 85Q110 49 160 43" stroke="#f5e4bd" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- 4 · espiral enrollada, borde de masa y marcas de corte -->
<g transform="translate(0 320)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="160" cy="162" r="128" fill="#725b7e" stroke="#514355" stroke-width="3"/>
  <circle cx="160" cy="158" r="127" fill="url(#sc-r-violet)" stroke="#695773" stroke-width="3"/>
