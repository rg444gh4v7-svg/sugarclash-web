:root{color-scheme:dark;--bg:#120e1b;--surface:#221b2d;--gold:#e8c795;--ink:#f6eddf;--muted:#b4a8bc;--line:#d4b2d126;--pink:#ed94af;--cyan:#9ce2df;--rail:92px;font-family:Karla,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,a,input,textarea{-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button{border:0}button:disabled{cursor:default;opacity:.4}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:5px}button:not(:disabled):active{translate:0 1px}button svg,.icon{width:20px;height:20px;vertical-align:middle;flex-shrink:0}a{color:var(--gold)}h1,h2,h3,p{margin:0}h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:400}button svg{pointer-events:none}.defs{position:absolute;width:0;height:0;overflow:hidden}[hidden]{display:none!important}

/* SUGAR CLASH · WARM CASUAL REBOOT · Jose's direction, 21 October 2026.
   Append LAST in the inline <style>. This deliberately replaces the former
   purple/mineral/editorial presentation. No runtime, save or navigation changes. */
:root{
  color-scheme:light;--bg:#f5f1e7;--surface:#fffcf6;--ink:#254657;
  --muted:#506f78;--gold:#a56826;--line:#dcc9a1;--pink:#db625d;--cyan:#267b91;
  --play-green:#3f8068;--play-green-dark:#295c49;--play-coral:#c97966;
  --play-blue:#5b8f9c;--play-butter:#d8b474;--play-paper:#fffcf6;
  --rail:88px;font-family:Karla,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
}
body{background:var(--bg);color:var(--ink)}
h1,h2,h3,.serif{font-family:Karla,system-ui,sans-serif;font-weight:700;letter-spacing:-.035em}
button,input,textarea{font-family:Karla,system-ui,sans-serif}
button:focus-visible,a:focus-visible{outline:3px solid #18788d;outline-offset:4px}
button:disabled{opacity:.58}
.app{background:linear-gradient(#f8f5ee,#f2ede2);min-height:100dvh}
.screen.active{animation:arrive .2s ease-out}
.eyebrow{color:#ad553a;font-size:10px;letter-spacing:.11em;font-weight:700;line-height:1.45}
.muted{color:var(--muted)}

/* A compact game toolbar, with tactile resources and a clear tab bar. */
.topbar{height:78px;padding:0 34px;background:#fffcf6;border-bottom:3px solid #eddfbc;gap:16px}
.brand{color:#254657;font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
.brand img,.brand-logo{display:block;width:168px;height:58px;object-fit:contain}
.brand small{color:#a45a3a;font:700 8px/1.4 Karla,system-ui,sans-serif;letter-spacing:.14em}
.resources{gap:8px}
.resource{min-height:38px;padding:7px 12px;border:2px solid #e0d5b9;border-radius:18px;background:#fffef8;color:#345965;font-size:14px;font-weight:700;box-shadow:none}
.resource svg{width:18px;height:18px;color:#b04f5b;stroke-width:2}
.resource.honey svg{color:#906612}.resource.gems svg{color:#1f7597}
.resource small{color:#5e7272;font-size:11px;font-weight:700}
.utility{color:#58727e;background:#eef4eb;border:1px solid #d9e4d5}
.rail{width:var(--rail);background:#fffcf6;border-right:3px solid #eddfbc;padding:25px 8px 16px;gap:12px}
.rail-logo{display:none}
.nav-item{position:relative;width:68px;min-height:65px;border-radius:17px;color:#57727c;font-weight:700;font-size:11px;gap:6px;background:transparent;border:2px solid transparent}
.nav-item svg{width:24px;height:24px;stroke-width:1.9}
.nav-item.active{color:#416c2e;background:#e3ece2;border-color:#cedcc9;box-shadow:none}
.nav-item.active::after{display:none}
.rail-bottom{margin-top:auto}

/* Clear controls: forest green means play, coral/blue remain supporting accents. */
.btn{min-height:51px;border:2px solid #3a715d;border-radius:16px;background:linear-gradient(#4c8b72,#3d7d64);color:#fff;font-size:15px;font-weight:700;letter-spacing:0;gap:10px;padding:12px 23px;box-shadow:none;text-shadow:0 1px 1px #244c3d33}
.btn.secondary{background:linear-gradient(#fffef9,#fff3d6);border-color:#dac6a0;color:#426270;box-shadow:none; text-shadow:none}
.btn.subtle{background:#f1f0e4;color:#5f726b;border-color:#d8d9c5;box-shadow:none;text-shadow:none}
.btn:not(:disabled):active{translate:0 1px;box-shadow:none}
.text-btn{color:#3d7485;font-size:13px;font-weight:700;min-height:42px}
.tag{border:2px solid #dfd3b2;background:#fffdf2;color:#527476;font-weight:700;letter-spacing:.05em}
.tag .dot{background:#3f8068}
.page-head{padding:30px 0 25px;gap:22px}
.page-head h1{font-size:40px;line-height:1.08;margin-top:7px;color:#294e5c}
.page-head p{font-size:14px;line-height:1.6;color:#577276;margin-top:11px}
.page-content{padding-top:0;max-width:1220px}
.section-line h2{font-size:25px;color:#2d5762;font-weight:700}
.section-line>span{color:#597370}

/* Native home dashboard. Root owns the corresponding HTML and real progress. */
.play-home{max-width:1180px;margin:auto;padding:22px 34px 35px}
.play-home-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:14px}
.home-wordmark{display:block;width:260px;max-width:70%;height:auto;object-fit:contain;margin:0 auto 10px}
.play-home-head .home-wordmark{margin:0;width:230px}
.home-wordmark img{display:block;width:100%;height:auto}
.play-home-title{font-size:27px;font-weight:700;line-height:1.1;color:#315968}
.play-world{position:relative;isolation:isolate;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:22px;border:5px solid #fffcf6;border-radius:18px;background:url('assets/renacer-meadow-v2.webp') center/cover;box-shadow:none;overflow:hidden}
.play-world::before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(transparent 55%,#3f77382e);pointer-events:none}
.play-world-art{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.play-world-copy{color:#284f59;text-align:center;max-width:460px;padding:14px 20px;border:2px solid #fffdf2cc;border-radius:18px;background:#fffdf0eb;box-shadow:none}
.play-world-copy .eyebrow{color:#a05d39;font-size:10px}
.play-world-copy h1,.play-world h1{font-size:31px;line-height:1.1;margin:5px 0 8px;text-shadow:none}
.play-world-copy p{font-size:13px;line-height:1.5;color:#56746f}
.play-level{min-height:59px;min-width:230px;font-size:21px;border-radius:18px;padding:14px 28px;display:flex;justify-content:center;align-items:center;gap:10px;margin:16px auto 5px}
.play-level small{font-size:12px;font-weight:700}
.play-progress{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:700;color:#577260;margin:15px auto;line-height:1.5;text-align:center}
.play-progress .progress-track{width:150px;height:10px;flex:none}
.play-companion{display:flex;align-items:center;gap:12px;padding:15px 18px;border:2px solid #e3d5b5;border-radius:18px;background:#fffcf6;margin:18px 0;box-shadow:none}
.play-companion .hero-companion{max-width:none;margin:0}
.play-companion .confite-art{width:58px;height:54px}
.play-companion .companion-copy{font-size:14px;line-height:1.5}
.play-modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:20px}
.play-modes button{min-height:83px;background:#fffdf4;border:2px solid #dfcfae;border-radius:18px;box-shadow:none;padding:12px;color:#365d6b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.play-modes button svg{width:25px;height:25px;color:#9a5e4c;stroke-width:2}
.play-modes button:nth-child(2) svg{color:#37748f}.play-modes button:nth-child(3) svg{color:#5a7633}.play-modes button:nth-child(4) svg{color:#906519}
.play-modes button small{font-size:11px;color:#607265;font-weight:700}

/* Transitional aliases until the new home HTML is assembled. */
.home-hero{background:#f5f1e7;min-height:510px;height:auto;max-height:none;padding:42px 5%;border:0;align-items:center;gap:25px}
.hero-art{inset:20px 25px 20px 43%;height:auto;background-image:url('assets/renacer-meadow-v2.webp');background-position:center;background-size:cover;filter:none;opacity:1;mask-image:none;border:5px solid #fffcf6;border-radius:18px;box-shadow:none}
.home-hero::before{background:none}
.hero-copy{max-width:420px}
.hero-copy .eyebrow{display:block;background:none;color:#a25b3c;padding:0;margin:0;letter-spacing:.1em;box-shadow:none;text-shadow:none;font-size:10px}
.hero-copy .eyebrow::before{display:none}
.hero-copy h1{font-family:Karla,system-ui,sans-serif;font-weight:700;font-size:52px;line-height:1.03;letter-spacing:-.05em;color:#2a5362;text-shadow:none;margin:15px 0 18px}
.hero-copy h1 em{font-style:normal;font-weight:700;color:#9a5e4c}
.hero-copy>p{color:#567471;font-size:14px;line-height:1.6}
.hero-actions .btn{min-width:220px;font-size:15px}
.hero-actions .text-btn{font-size:12px}
.chapter-note{font-size:12px;font-weight:700;color:#617351;letter-spacing:0;margin-top:14px}
.hero-side-note,.home-footnote{display:none}
.hero-quick{display:flex;gap:12px;margin-top:22px}
.hero-quick button{background:#fffcf6;border:2px solid #e1ceab;border-radius:13px;color:#4a6a74;min-height:42px;padding:9px 15px;font-size:13px;font-weight:700}
.hero-quick svg{color:#9a5e4c}
.hero-companion{gap:12px}
.confite-art{filter:drop-shadow(0 4px 2px #bc9c7740)}
.companion-copy{font-size:13px;line-height:1.6;color:#567376}
.companion-copy b{display:block;color:#9a5d62;font-size:9px;font-weight:700;letter-spacing:.12em}
.home-bottom{padding-top:15px}
.home-daily{padding:21px;border:2px solid #e2d5b2;border-radius:18px;background:#fffdf4;box-shadow:none;margin-top:23px}
.home-daily h3{font-size:24px;font-weight:700;color:#325866}
.home-daily p{font-size:13px;line-height:1.6;color:#5c736e}
.home-daily .eyebrow{font-size:9px}
.home-daily .btn{font-size:13px}

/* World map: readable chapter stops, warm paper, green next-level marker. */
.territory-preview{border:3px solid #e2d3ac;border-radius:18px;background:#fffcf6;box-shadow:none;overflow:hidden}
.world-panorama{background-image:url('assets/renacer-meadow-v2.webp');background-size:cover;background-position:center}
.territory-preview .world-panorama{height:190px;filter:saturate(var(--sat,1))}
.territory-preview .world-panorama::after{background:linear-gradient(transparent 65%,#fffcf6)}
.territory-info{padding:6px 25px 24px}
.territory-info h2{font-size:30px;font-weight:700;color:#2f5963;margin:8px 0 12px;line-height:1.1}
.territory-info>p{color:#5a736c;font-size:13px;line-height:1.65;-webkit-line-clamp:unset;display:block;overflow:visible}
.progress-track{height:9px;border-radius:8px;background:#e8ead2;box-shadow:none;overflow:hidden}
.progress-track i{background:linear-gradient(#76a78b,#4d8b6d);border-radius:inherit;box-shadow:none}
.progress-meta{font-size:11px;font-weight:700;color:#5c7368;margin-top:9px}
.territory-picker{gap:8px;margin-top:20px}
.territory-dot{width:37px;height:37px;min-width:0;min-height:0;border:2px solid #d5d8ba;border-radius:12px;color:#63725f;background:#f5f4e6;font-size:13px;font-weight:700;box-shadow:none}
.territory-dot.selected{color:#fff;background:#4d8870;border-color:#43725f;box-shadow:none}
.territory-dot.locked{opacity:1;color:#69705d;background:#efefdf;border-color:#e0e0c9}
.route{gap:10px;padding-top:3px}
.route::before{left:34px;border-left:4px dotted #deca97;top:35px;bottom:55px}
.route-stop{min-height:88px;padding:9px 15px 9px 4px;border:2px solid transparent;border-radius:18px;gap:15px}
.route-stop.current{border-color:#9fbba4;background:#edf2e7;box-shadow:none}
.route-marker{width:64px;height:64px;border:3px solid #e6d2a7;background:#fffcf6;box-shadow:none}
.route-marker .sprite{width:58px;height:58px;inset:0}
.route-marker>span:last-child{font-size:10px;font-weight:700;color:#54713d;background:#fff7d5;border:2px solid #dfce99;border-radius:8px;padding:1px 6px;bottom:-7px}
.route-stop.current .route-marker{border-color:#5c8e73;background:#fbffeb;box-shadow:none}
.route-stop.current .route-label strong{color:#416b31}
.route-label strong{font-size:14px;font-weight:700;color:#3e6570}
.route-label small{display:block;font-size:11px;color:#5e7267;line-height:1.4;margin-top:5px}
.route-stop>svg{color:#5e7446;width:18px;stroke-width:2}
.route-stop.locked{opacity:1}
.route-stop.locked .route-marker{background:#efeee0;border-color:#d9dcc6;box-shadow:none}
.route-stop.locked .sprite{opacity:.6;filter:grayscale(.8) brightness(1.08)}
.route-stop.locked .route-label strong{color:#627067}
.route-stop.locked .route-label small{display:block;color:#657064}
.route-stop.locked>svg{color:#687060}
.stars{color:#906612;letter-spacing:2px;text-shadow:0 1px 0 #f9e49b;font-size:13px}

/* Modes stay direct: bold names, distinct colored backdrops, one play button. */
.modes-list{gap:18px}
.mode-feature{border:2px solid #e1d2ad;border-radius:18px;background:#fffcf6;padding:18px;gap:24px;box-shadow:none}
.mode-feature-art{background:linear-gradient(#e2ebe6,#edf0e1);border-radius:18px;height:158px;border:2px solid #d0e5cc}
.mode-feature:nth-child(2) .mode-feature-art{background:linear-gradient(#eee4d2,#f4eee2);border-color:#f1d5a4}
.mode-feature:nth-child(3) .mode-feature-art{background:linear-gradient(#f0e0d9,#f5eee5);border-color:#f1cabe}
.mode-feature:nth-child(4) .mode-feature-art{background:linear-gradient(#e2e7d7,#f3f1e5);border-color:#d8e4b6}
.mode-feature-art .sprite{filter:drop-shadow(0 4px 3px #7d937a50)}
.mode-feature-copy h2{font-size:29px;font-weight:700;color:#345d68;margin:6px 0 9px}
.mode-feature-copy p{font-size:13px;color:#5b726b;line-height:1.6}
.mode-feature-copy small{color:#916536;font-size:11px;font-weight:700}
.mode-link{border:2px solid #ded0ae;border-radius:18px;background:#fffcf6;box-shadow:none;padding:19px;min-height:112px;color:#355e67}
.mode-link::before{background:linear-gradient(#e2ebe6,#e9f3d1);opacity:1;scale:1;transition:none}
.mode-link::after{background:none}
.mode-link:nth-child(2)::before{background:linear-gradient(#eee4d2,#f5eee1)}
.mode-link:nth-child(3)::before{background:linear-gradient(#eddfd6,#f4eee6)}
.mode-link b{font-family:Karla,system-ui,sans-serif;font-size:23px;font-weight:700;color:#365d65;letter-spacing:-.03em}
.mode-link small{color:#607268;font-size:12px;max-width:none;line-height:1.5}
.mode-link .mode-arrow{color:#427580}
.mode-link .mode-badge{display:none}

/* Confite's village feels like a crafted daylight landscape. */
.village-scene{background:#e4e8d7;border:4px solid #fffcf6;border-radius:18px;box-shadow:none;isolation:isolate}
.village-scene::before{background:url('assets/renacer-meadow-v2.webp') center/cover;filter:none;opacity:.55;z-index:-1}
.village-scene svg.path{opacity:.95;filter:drop-shadow(0 2px 1px #ad94535e)}
.village-node .sprite,.village-node.built .sprite{filter:drop-shadow(0 4px 2px #7b8d5266)}
.village-node.next .sprite{filter:drop-shadow(0 0 3px #fffdf4) drop-shadow(0 4px 2px #7b8d5266)}
.village-node.locked .sprite{filter:grayscale(.75) brightness(1.08);opacity:.75}
.village-node.selected::before{border:3px solid #fff9da;box-shadow:none;inset:12px 0 8px}
.village-node>small{background:#fffdf2;color:#587047;border:2px solid #d3d3a4;border-radius:8px;padding:4px 7px;font-size:9px;font-weight:700;text-shadow:none;line-height:1.3;max-width:135px}
.village-detail{background:#fffcf6;border:3px solid #e0d1ad;border-radius:18px;box-shadow:none;padding:27px}
.village-detail h2{color:#315c67;font-size:29px;font-weight:700}

/* Warm, finite feedback. No new layout dimensions or interaction targets. */
.sc-fx-layer{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden;contain:strict}
.sc-fx-group{position:absolute;inset:0;pointer-events:none}
.sc-fx{position:absolute;display:block;pointer-events:none;transform:translate(-50%,-50%);will-change:transform,opacity}
.sc-spark{width:5px;height:5px;border-radius:2px;background:var(--fx-color,#ffc45c);box-shadow:0 1px 2px #405f5b20;animation:scSpark .48s cubic-bezier(.15,.65,.4,1) var(--fx-delay,0ms) both}
.sc-star{width:8px;height:8px;border-radius:0;clip-path:polygon(50% 0,64% 33%,100% 50%,65% 65%,50% 100%,35% 65%,0 50%,35% 35%)}
.sc-ring{width:var(--fx-size,36px);height:var(--fx-size,36px);border:2px solid var(--fx-color,#ffc45c);border-radius:50%;animation:scRing .33s ease-out both}
.sc-light{width:7px;height:7px;border:1px solid #fff;border-radius:50%;background:#ffd977;box-shadow:0 0 7px #ffd65c77;animation:scLight .53s cubic-bezier(.15,.7,.55,1) var(--fx-delay,90ms) both}
.sc-win-spark{width:5px;height:5px;border-radius:50%;background:var(--fx-color,#ffc45c);animation:scWinSpark .88s cubic-bezier(.1,.7,.4,1) var(--fx-delay,0ms) both}
.sc-win-spark.sc-star{width:9px;height:9px}
.board-flash{inset:auto;top:7px;left:50%;width:max-content;max-width:94%;min-width:125px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 15px;border:1px solid #cce2d7;border-radius:10px;background:#fffaf0f5;box-shadow:0 4px 14px #375c4b20;color:#237c72;text-shadow:none;font:700 16px/1.1 Karla,system-ui,sans-serif;transform:translateX(-50%);opacity:0;z-index:8}
.board-flash.sc-combo-visible{opacity:1;animation:scCombo .98s cubic-bezier(.2,.8,.4,1) both}
.sc-combo-title{font:700 16px/1.1 Karla,system-ui,sans-serif;white-space:nowrap}
.sc-combo-sub{font:700 9px/1.2 Karla,system-ui,sans-serif;color:#66796b;letter-spacing:.02em;white-space:nowrap}
.board-flash[data-tier="3"] .sc-combo-title{color:#df7950}

.board-flash[data-tier="power"] .sc-combo-title{color:#ba6b91}
.sc-board-pop{animation:scBoardPop .3s ease-out}
.sc-score-up{animation:scScoreUp .25s ease-out}
.sc-made{animation:scMade .42s ease-out}
.sc-hit-still{box-shadow:inset 0 0 0 2px #fff5b5}
.modal.sc-earned-win{border-color:#83c9a8;box-shadow:0 5px 0 #5eab8e55,0 18px 55px #284f4833}
.modal.sc-earned-win .modal-art .sprite,.modal.sc-earned-win .modal-art .confite-art{animation:scWinArt .65s cubic-bezier(.2,.8,.4,1)}
.modal.sc-earned-win .result-next{border-color:#addbc5;background:#f1fbef;color:#426b55}
.modal.sc-earned-win .result-next b{color:#277b62}
@keyframes scSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--fx-x)),calc(-50% + var(--fx-y))) rotate(var(--fx-turn,90deg)) scale(.35)}}
@keyframes scRing{0%{opacity:.8;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes scLight{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1}48%{opacity:1;transform:translate(calc(-50% + var(--fx-mid-x)),calc(-50% + var(--fx-mid-y))) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--fx-x)),calc(-50% + var(--fx-y))) scale(.3)}}
@keyframes scWinSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}14%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--fx-x)),calc(-50% + var(--fx-y))) rotate(var(--fx-turn,90deg)) scale(.55)}}
@keyframes scCombo{0%{opacity:0;transform:translate(-50%,5px) scale(.97)}20%{opacity:1;transform:translate(-50%,0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-5px) scale(.99)}}
@keyframes scBoardPop{35%{box-shadow:0 0 0 3px #fff2bc99,0 7px 18px #3a8f7b33}100%{box-shadow:0 0 0 0 #fff2bc00}}
@keyframes scScoreUp{45%{transform:scale(1.06);color:#d58e46}100%{transform:scale(1)}}

   Cell contract: --c/--r/--size; data-restored="0|1" or "false|true";
   kind path|water|garden|home, with river/flora/shelter aliases. */

/* Keep the six colors and silhouettes, soften the baked specular highlights. */
.piece .candy,.piece[data-power="prism"] .candy{
  background-image:url('assets/candies-restoration-v1.svg');
  filter:saturate(.9) contrast(.94) brightness(.98) drop-shadow(0 2px 1px #07131d80);
}
.cell-key i{background-image:url('assets/candies-restoration-v1.svg');filter:saturate(.9) contrast(.94) brightness(.98)}
.piece.selected{background:#d1b88722;outline-color:#e2c99c}
.piece[data-power="row"]::after,.piece[data-power="col"]::after,
.piece[data-power="bomb"]::after{filter:drop-shadow(0 1px 1px #15232c);box-shadow:none}

/* Quiet worked stone, a restrained survey line, no commercial checkerboard. */
.board-frame{
  padding:9px;border:1px solid #706e60;border-radius:12px;
  background:linear-gradient(135deg,#4c504b,#303a3e 60%,#4b5149);
  box-shadow:inset 0 0 0 3px #202b2f,0 8px 22px #07121b33;
}
.board-frame::before{
  content:"";position:absolute;inset:4px;border:1px solid #c5baa03b;
  border-radius:8px;pointer-events:none;z-index:5;
}
.board{
  isolation:isolate;border-radius:5px;background-color:#263136;
  background-image:linear-gradient(116deg,#7b81760a,transparent 45%),
    repeating-linear-gradient(8deg,transparent 0 8px,#c6c4a504 8px 9px,transparent 9px 18px);
}

/* This layer is attached to the place, not to the falling candy. */
.restoration-layer{position:absolute;inset:0;z-index:auto;pointer-events:none}
.restoration-cell{
  --cell-pigment:#52645a;--cell-line:#a8b599;
  position:absolute;z-index:auto;pointer-events:none;
  left:calc(var(--c) * 100% / var(--size));top:calc(var(--r) * 100% / var(--size));
  width:calc(100% / var(--size));height:calc(100% / var(--size));
  border:1px solid #18272b9c;border-radius:3px;overflow:visible;
  background:linear-gradient(145deg,#4a5150,#343f42 72%);
  box-shadow:inset 0 1px 0 #c2c6b216,inset 1px 0 0 #c2c6b20a;
  transition:background-color .28s ease,border-color .28s ease;
}
.restoration-cell::before,.restoration-cell::after{
  content:"";position:absolute;pointer-events:none;opacity:.28;
}
.restoration-cell::before{
  inset:0;background:linear-gradient(138deg,transparent 37%,#c6c9b212 38% 39%,transparent 40%),
    linear-gradient(23deg,transparent 63%,#0e202424 64% 65%,transparent 66%);
}
.restoration-cell::after{
  width:32%;height:1px;left:12%;bottom:18%;background:#bac5b844;
  transform:rotate(-18deg);transform-origin:left center;
}
.restoration-cell:is([data-restored="1"],[data-restored="true"]){
  background-color:var(--cell-pigment);
  background-image:linear-gradient(145deg,#e0d8b20b,#10252c16 72%);
  border-color:#2033329c;
  box-shadow:inset 0 1px 0 #d9dfbe2e,inset 1px 0 0 #d9dfbe0d;
}
.restoration-cell:is([data-restored="1"],[data-restored="true"])::after{
  background:var(--cell-line);opacity:.55;
}
.restoration-cell>b{display:none}
.restoration-cell[data-active="1"]>b{
  position:absolute;display:grid;place-items:center;right:2px;bottom:2px;z-index:3;
  width:14px;height:14px;border:1px solid #b3ba9c99;border-radius:4px;
  background:#263c3eed;color:#e8e2ca;font:700 9px/1 Karla,system-ui,sans-serif;
  text-shadow:none;pointer-events:none;box-shadow:0 1px 2px #07141c55;
}
.restoration-cell[data-active="1"][data-hp="2"]>b{background:#514939f2;border-color:#b3a078;color:#f0dfba}
.restoration-cell[data-active="1"]:is([data-restored="1"],[data-restored="true"])>b{
  background:#36463bf2;border-color:#879b7e;color:#d4e0bf;
}

/* Material identities remain distinguishable by their marks, not just hue. */
.restoration-cell[data-kind="path"]{--cell-pigment:#645b49;--cell-line:#c2b18a}
.restoration-cell[data-kind="path"]::before{
  inset:2px;background:linear-gradient(91deg,transparent 47%,#15252966 48% 50%,transparent 51%),
    linear-gradient(1deg,transparent 62%,#15252966 63% 65%,transparent 66%);
  opacity:.5;
}
.restoration-cell[data-kind="path"]::after{bottom:11%;left:13%;width:19%;transform:rotate(0)}
.restoration-cell:is([data-kind="water"],[data-kind="river"]){--cell-pigment:#3f6262;--cell-line:#9ebeb7}
.restoration-cell:is([data-kind="water"],[data-kind="river"])::after{
  width:88%;height:25%;left:2%;bottom:18%;border-top:1px solid #c1ceca66;
  border-radius:50%;background:none;transform:rotate(-18deg);
  box-shadow:0 -7px 0 -6px #c1ceca55;
}
.restoration-cell:is([data-kind="water"],[data-kind="river"]):is([data-restored="1"],[data-restored="true"])::after{
  border-color:#a8cbc188;background:none;opacity:.85;
}
.restoration-cell:is([data-kind="garden"],[data-kind="flora"]){--cell-pigment:#52634a;--cell-line:#b8bf85}
.restoration-cell:is([data-kind="garden"],[data-kind="flora"])::after{
  width:13%;height:24%;left:16%;bottom:9%;border-radius:0 80% 0 80%;
  background:#8e9b804d;transform:rotate(-26deg);
}
.restoration-cell:is([data-kind="home"],[data-kind="shelter"]){--cell-pigment:#69584d;--cell-line:#c9ab7a}
.restoration-cell:is([data-kind="home"],[data-kind="shelter"])::after{
  width:13%;height:14%;left:16%;bottom:12%;border-radius:1px;background:#92917b44;
  border:1px solid #c5c3a044;transform:none;
}
.restoration-cell:is([data-kind="home"],[data-kind="shelter"]):is([data-restored="1"],[data-restored="true"])::after{
  background:#c4a575b3;border-color:#d7c19899;opacity:.85;
}

.restoration-meter .progress-track,.restoration-meter>progress{

.restoration-receipt{

ton class="btn" onclick="buildStructure('${b.id}')" ${save.coins<b.cost?'disabled':''}>Construir · ${b.cost} de miel ${icon('honey')}</button>${save.coins<b.cost?`<p style="grid-column:span 2;text-align:center;margin-top:10px">Te faltan ${b.cost-save.coins} de miel. Sigue la campaña para reunirla.</p>`:''}`:`<button class="btn subtle" disabled>Primero recupera ${BUILDINGS[i-1].name}</button>`}${companion(built?'No es solo lo que construimos. Es con quién lo compartimos.':'¿Lo imaginas? Las ventanas encendidas otra vez.')}</div></div></div>`;}

function dailySeed(key){let h=2166136261;for(const c of key)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function seededRandom(seed){return ()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);}
function dailyConfig(key=dayKey()){const seed=dailySeed(key);return {mode:'daily',dailyKey:key,t:seed%8+1,n:seed%9+1,size:7,colors:5,type:'rescue',goal:1500,moves:20,targetColor:0,seed};}
function startDaily(){startBoard(dailyConfig());}

/* Pure match-3 rules. No DOM or persistence in this layer. */
let pieceSequence=0;
function newPiece(color,power=null){return {id:++pieceSequence,color,power};}
function runGroups(board,size){const groups=[];for(let r=0;r<size;r++)for(let c=0;c<size;c++){const i=r*size+c,p=board[i];if(!p||p.color===6)continue;if(c===0||board[i-1]?.color!==p.color){let end=c+1;while(end<size&&board[r*size+end]?.color===p.color)end++;if(end-c>=3)groups.push({axis:'row',cells:Array.from({length:end-c},(_,k)=>i+k)});}if(r===0||board[i-size]?.color!==p.color){let end=r+1;while(end<size&&board[end*size+c]?.color===p.color)end++;if(end-r>=3)groups.push({axis:'col',cells:Array.from({length:end-r},(_,k)=>i+k*size)});}}return groups;}
function matchedCells(board,size){return [...new Set(runGroups(board,size).flatMap(g=>g.cells))];}
function canCombine(a,b){return !!(a&&b&&(a.color===6||b.color===6||(a.power&&b.power)));}
function legalMoves(board,size){const result=[];for(let i=0;i<board.length;i++)for(const j of [i%size<size-1?i+1:-1,i+size<board.length?i+size:-1]){if(j<0)continue;if(canCombine(board[i],board[j])){result.push([i,j]);continue;}[board[i],board[j]]=[board[j],board[i]];const m=matchedCells(board,size);if(m.includes(i)||m.includes(j))result.push([i,j]);[board[i],board[j]]=[board[j],board[i]];}return result;}
function makeBoard(size=7,colors=5,rng=Math.random){let b;for(let attempts=0;attempts<200;attempts++){b=[];for(let i=0;i<size*size;i++){const allowed=Array.from({length:colors},(_,c)=>c).filter(c=>!(i%size>=2&&b[i-1].color===c&&b[i-2].color===c)&&!(i>=size*2&&b[i-size].color===c&&b[i-size*2].color===c));b.push(newPiece(allowed[Math.floor(rng()*allowed.length)]));}if(legalMoves(b,size).length)return b;}throw new Error('No se pudo crear un tablero jugable.');}
function powerCreation(board,size,groups,preferred=[]){const all=[...new Set(groups.flatMap(g=>g.cells))],order=[...preferred,...all];for(const i of order){const p=board[i];if(!p||p.power||p.color===6)continue;const own=groups.filter(g=>g.cells.includes(i));if(!own.length)continue;const longest=own.reduce((a,b)=>a.cells.length>=b.cells.length?a:b);if(longest.cells.length>=5)return {index:i,color:6,power:'prism'};if(own.some(x=>x.axis==='row')&&own.some(x=>x.axis==='col'))return {index:i,color:p.color,power:'bomb'};if(longest.cells.length>=4)return {index:i,color:p.color,power:longest.axis};}return null;}
function expandEffects(board,size,seeds,protectedIndex=-1,prismColor=null){const cells=new Set(),queue=[...seeds],triggered=new Set();for(let k=0;k<queue.length;k++){const i=queue[k];if(i<0||i>=board.length||i===protectedIndex||cells.has(i))continue;cells.add(i);const p=board[i];if(!p||!p.power||triggered.has(i))continue;triggered.add(i);const r=Math.floor(i/size),c=i%size;switch(p.power){case 'row':for(let x=0;x<size;x++)queue.push(r*size+x);break;case 'col':for(let y=0;y<size;y++)queue.push(y*size+c);break;case 'bomb':for(let y=Math.max(0,r-1);y<=Math.min(size-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(size-1,c+1);x++)queue.push(y*size+x);break;case 'prism':{const color=prismColor??board.find(x=>x&&x.color!==6)?.color??0;board.forEach((x,j)=>{if(x?.color===color)queue.push(j);});break;}}}return {cells:[...cells],triggered:[...triggered]};}
function gravity(board,size,colors=5,rng=Math.random){const fresh=[];for(let c=0;c<size;c++){let dest=size-1;for(let r=size-1;r>=0;r--){const p=board[r*size+c];if(p){board[dest*size+c]=p;if(dest!==r)board[r*size+c]=null;dest--;}}while(dest>=0){const i=dest*size+c;board[i]=newPiece(Math.floor(rng()*colors));fresh.push(board[i].id);dest--;}}return fresh;}
function reshuffle(board,size,rng=Math.random){const original=board.slice();for(let attempt=0;attempt<300;attempt++){for(let i=board.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[board[i],board[j]]=[board[j],board[i]];}if(!matchedCells(board,size).length&&legalMoves(board,size).length)return true;}board.splice(0,board.length,...original);return false;}
function teachingBoard(size,colors){for(let attempt=0;attempt<200;attempt++){const b=makeBoard(size,colors);for(const [i,c] of [[22,0],[23,0],[24,1],[25,0],[17,0],[21,2],[26,2],[10,2],[31,2]])b[i].color=c;if(!matchedCells(b,size).length)return b;}return makeBoard(size,colors);}

/* RESTORATION_START — fixed ground, independent of falling piece identities. */
function encounterConfig(t,n){
 const original=RESTORATION_ENCOUNTERS[n-1];
 const e={...original,pattern:{...original.pattern,cells:original.pattern.cells.slice()},rule:{...original.rule}};
 if(t>1){
  const rotate=i=>{let r=Math.floor(i/7),c=i%7;for(let k=0;k<(t-1)%4;k++)[r,c]=[c,6-r];return r*7+c;};
  e.pattern.cells=e.pattern.cells.map(rotate);
  const chapter=RESTORATION_CHAPTERS[t];
  e.place=LEVEL_NAMES_ALL[t][n];e.title=e.place;e.change=chapter.changes[n===10?3:n>=7?2:n>=4?1:0];
  e.confiteStart=chapter.start;e.confiteWin=chapter.win;
  const descriptions={direct:'Haz combinaciones sobre las zonas marcadas para recuperar este lugar.',adjacent:'Despierta las marcas limpiando encima o junto a sus bordes.',power:'Abre los sellos con rayos, bombas, estrellas o el Pulso activo.',ordered:'Recupera las marcas en el orden señalado. Sólo recibe daño la iluminada.',color:'Combina dorados encima o junto a las marcas. Los poderes y el Pulso también cuentan.',tide:'Restaura la fila iluminada. La luz cambia de fila después de cada jugada válida.'};
  e.brief=descriptions[e.rule.kind]+(e.pattern.hp===2?' Cada marca tiene dos capas.':'');e.hint=e.brief+' Cada brote limpia las piezas de alrededor.';
  e.pattern.kind=chapter.kind;
 }
 return e;
}
function makeRestoration(config,size){
 const cells=[...new Set(config.pattern.cells)].filter(i=>Number.isInteger(i)&&i>=0&&i<size*size).map(index=>({index,hp:config.pattern.hp===2?2:1,maxHp:config.pattern.hp===2?2:1,restored:false}));
 return {cells,rule:{...config.rule},kind:config.pattern.kind,turn:0,total:cells.length,restored:0};
}
function restorationTargets(rest,size){
 const pending=rest.cells.filter(c=>!c.restored);
 if(rest.rule.kind==='ordered')return pending.slice(0,1).map(c=>c.index);
 if(rest.rule.kind==='tide'){
  const rows=[...new Set(rest.cells.map(c=>Math.floor(c.index/size)))].sort((a,b)=>a-b);
  return pending.filter(c=>Math.floor(c.index/size)===rows[rest.turn%rows.length]).map(c=>c.index);
 }
 return pending.map(c=>c.index);
}
function groundNeighbors(index,size){
 return [index%size>0?index-1:-1,index%size<size-1?index+1:-1,index-size,index+size].filter(i=>i>=0&&i<size*size);
}
function restorationStep(rest,board,size,cleared,{powered=[],pulse=false,protectedIndex=-1}={}){
 const hit=new Set(cleared),power=new Set(powered),active=new Set(restorationTargets(rest,size));
 const state={...rest,rule:{...rest.rule},cells:rest.cells.map(c=>({...c}))},restored=[],bonus=new Set();
 for(const c of state.cells){
  if(c.restored||!active.has(c.index))continue;
  const near=[c.index,...groundNeighbors(c.index,size)];let touched=false;
  switch(rest.rule.kind){
   case 'adjacent':touched=near.some(i=>hit.has(i));break;

    const t=1-m.remaining/m.max;c.fillStyle='#d5647c24';c.strokeStyle=m.team==='ally'?'#b9e5d6':'#ff8b9f';c.lineWidth=2;c.beginPath();c.arc(m.x,m.y,m.r,0,Math.PI*2);c.fill();c.stroke();
    c.fillStyle='#ff9b9948';c.beginPath();c.moveTo(m.x,m.y);c.arc(m.x,m.y,m.r-3,-Math.PI/2,-Math.PI/2+t*Math.PI*2);c.closePath();c.fill();c.strokeStyle='#ffe6d9';c.lineWidth=1;c.beginPath();c.moveTo(m.x-5,m.y);c.lineTo(m.x+5,m.y);c.moveTo(m.x,m.y-5);c.lineTo(m.x,m.y+5);c.stroke();
  }
  // Soft range guide makes Pulse's reach visible while it is ready.
  if(arenaAlive(s.player)&&s.pulse===0){c.strokeStyle='#efd4a21c';c.lineWidth=1;c.setLineDash([3,9]);c.beginPath();c.arc(s.player.x,s.player.y,112,0,Math.PI*2);c.stroke();c.setLineDash([]);}
  s.units.filter(arenaAlive).sort((a,b)=>a.y-b.y).forEach(u=>arenaDrawSprite(c,u,s));
  for(const f of s.effects){const t=1-f.life/f.max;c.save();c.globalAlpha=1-t;
    if(f.kind==='hit'||f.kind==='dash'){c.strokeStyle=f.color||'#f3d5a9';c.lineWidth=f.kind==='dash'?10:2.5;c.lineCap='round';c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x2,f.y2);c.stroke();}
    else{c.strokeStyle=f.color||'#f7ddac';c.lineWidth=f.kind==='pulse'?4:2;c.beginPath();c.arc(f.x,f.y,(f.r||31)*(f.kind==='pulse'?t:.4+t*.6),0,Math.PI*2);c.stroke();if(f.kind==='burst'){for(let i=0;i<7;i++){const a=i*Math.PI*2/7;c.fillStyle=f.color;c.fillRect(f.x+Math.cos(a)*t*35-2,f.y+Math.sin(a)*t*35-2,4,4);}}}
    c.restore();}
  if(s.mode==='war'&&!arenaAlive(s.player)){
    c.fillStyle='#171025bb';c.fillRect(50,255,290,68);c.fillStyle='#f8e5c2';c.textAlign='center';c.font='500 20px Fraunces,Georgia,serif';c.fillText('Tu luz vuelve en '+Math.max(1,Math.ceil(s.player.respawn))+' s',195,283);c.font='11px Karla,sans-serif';c.fillStyle='#c8bfd0';c.fillText('Tu equipo mantiene la defensa.',195,307);
  }
}

/* ARENA_END */
/* FEEDBACK_START */
/* Sugar Clash: finite, cosmetic feedback. No engine RNG, rewards or persistent fields. */
const scFeedback={run:-1,layer:null,timers:new Set(),classes:new Set(),voices:new Set(),audio:null,lastSound:{},lastWave:null};
function feedbackReduced(){try{return matchMedia('(prefers-reduced-motion:reduce)').matches;}catch{return false;}}
function feedbackCurrent(g,finished=false){return !!(g&&state.game===g&&g.run===state.run&&state.screen==='game'&&!document.hidden&&(finished||!g.done)&&!g.paused);}
function feedbackLater(fn,ms){const id=setTimeout(()=>{scFeedback.timers.delete(id);fn();},ms);scFeedback.timers.add(id);return id;}
function feedbackClass(node,name,ms){
  if(!node)return;
  for(const old of scFeedback.classes)if(old.node===node&&old.name===name){clearTimeout(old.timer);scFeedback.timers.delete(old.timer);scFeedback.classes.delete(old);}
  const entry={node,name,timer:null};scFeedback.classes.add(entry);node.classList.remove(name);void node.offsetWidth;node.classList.add(name);
  entry.timer=feedbackLater(()=>{node.classList.remove(name);scFeedback.classes.delete(entry);},ms);
}
function feedbackCancel(){
  for(const id of scFeedback.timers)clearTimeout(id);scFeedback.timers.clear();
  for(const {node,name} of scFeedback.classes)node.classList.remove(name);scFeedback.classes.clear();
  if(scFeedback.layer)scFeedback.layer.remove();scFeedback.layer=null;
  for(const voice of scFeedback.voices){try{voice.stop();voice.disconnect();}catch{}}scFeedback.voices.clear();
  scFeedback.run=-1;scFeedback.lastWave=null;
}
function feedbackLayer(g){
  if(scFeedback.run!==g.run){if(scFeedback.run!==-1)feedbackCancel();scFeedback.run=g.run;}
  if(!scFeedback.layer){const layer=document.createElement('div');layer.id='sc-feedback-layer';layer.className='sc-fx-layer';layer.setAttribute('aria-hidden','true');document.body.appendChild(layer);scFeedback.layer=layer;}
  return scFeedback.layer;
}
function feedbackGroup(g){
  const layer=feedbackLayer(g);
  while(layer.childElementCount>=3)layer.firstElementChild.remove();
  const group=document.createElement('div');group.className='sc-fx-group';group.dataset.run=g.run;layer.appendChild(group);
  feedbackLater(()=>group.remove(),1150);return group;
}
function feedbackParticle(group,kind,x,y,style){
  const el=document.createElement('i');el.className='sc-fx '+kind;el.style.left=x+'px';el.style.top=y+'px';
  for(const [name,value] of Object.entries(style||{}))el.style.setProperty(name,String(value));group.appendChild(el);return el;
}
function feedbackCenter(node){if(!node)return null;const r=node.getBoundingClientRect();return r.width&&r.height?{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width}:null;}
function feedbackHit(g,cells,detail={}){
  if(!feedbackCurrent(g)||!cells.length)return;
  if(scFeedback.run!==g.run){if(scFeedback.run!==-1)feedbackCancel();scFeedback.run=g.run;}
  // Keep this actual wave for the readable combo caption immediately after it.
  scFeedback.lastWave={game:g,run:g.run,chain:g.chain,points:detail.points||0,power:!!detail.power};
  const board=$('board');if(!board)return;
  if(feedbackReduced()){feedbackClass(board,'sc-hit-still',160);return;}
  const group=feedbackGroup(g),colors=['#ff758a','#54bf92','#56bfd0','#ffc45c','#b98be8','#ff9b70','#fff2b0'];
  // Deterministic sampling: at most three candy centers, three small fragments each.
  const count=Math.min(3,cells.length),centers=[];
  for(let j=0;j<count;j++){
    const i=cells[Math.floor(j*cells.length/count)],p=g.board[i];if(!p)continue;
    const center=feedbackCenter(board.querySelector(`[data-id="${p.id}"]`));if(!center)continue;
    centers.push(center);const color=colors[p.color]||colors[0];
    for(let n=0;n<3;n++){
      const angle=((p.id*37+g.chain*19+n*120)%360)*Math.PI/180;
      const radius=Math.min(24,center.w*.6)+(n%2)*4;
      feedbackParticle(group,n===0?'sc-spark sc-star':'sc-spark',center.x,center.y,{
        '--fx-color':color,'--fx-x':Math.cos(angle)*radius+'px','--fx-y':Math.sin(angle)*radius-9+'px','--fx-turn':(n%2?100:-100)+'deg','--fx-delay':n*14+'ms'
      });
    }
    if(j<(detail.power?2:1))feedbackParticle(group,'sc-ring',center.x,center.y,{'--fx-color':color,'--fx-size':Math.min(47,center.w*1.1)+'px'});
  }
  const destination=feedbackCenter($('score-value'));
  if(destination)for(let j=0;j<Math.min(3,centers.length);j++){
    const p=centers[j],dx=destination.x-p.x,dy=destination.y-p.y;
    feedbackParticle(group,'sc-light',p.x,p.y,{'--fx-x':dx+'px','--fx-y':dy+'px','--fx-mid-x':dx*.45+'px','--fx-mid-y':dy*.4-24+'px','--fx-delay':90+j*60+'ms'});
  }
  if(destination)feedbackLater(()=>{if(feedbackCurrent(g))feedbackClass($('score-value'),'sc-score-up',260);},610);
  if(detail.power||g.chain>=3)feedbackClass(board.closest('.board-frame'),'sc-board-pop',320);
  if(detail.created){const p=g.board[detail.created.index],node=p&&board.querySelector(`[data-id="${p.id}"] .candy`);feedbackClass(node,'sc-made',430);}
}
function feedbackCombo(g,detail={}){
  if(!feedbackCurrent(g))return;const el=$('board-flash');if(!el)return;
  const wave=scFeedback.lastWave?.game===g&&scFeedback.lastWave.chain===g.chain?scFeedback.lastWave:null;
  const chain=detail.chain??g.chain??1,power=detail.power??wave?.power??false,points=detail.points??wave?.points??0;
  const label=chain>=5?'Cascada excelente':chain===4?'Gran cascada':chain===3?'En cadena':chain===2?'Buena combinación':power?'Poder activado':detail.label||'Luz recuperada';
  const title=document.createElement('strong'),sub=document.createElement('small');title.className='sc-combo-title';title.textContent=label;
  sub.className='sc-combo-sub';sub.textContent=(chain>1?'Cascada '+chain:power?'Poder activado':'Luz recuperada')+(points>0?' · +'+points.toLocaleString('es')+' de luz':'');
  el.replaceChildren(title,sub);el.dataset.tier=power?'power':Math.min(5,chain);
  feedbackClass(el,'sc-combo-visible',1000);
}
function feedbackVictory(g){
  // Call only after finishBoard has validated and committed the real win.
  if(!feedbackCurrent(g,true)||!g.done||!Number.isFinite(g.goal)||g.progress<g.goal)return;
  const modal=$('modal-root')?.querySelector('.modal');if(!modal)return;
  if(scFeedback.run!==g.run){if(scFeedback.run!==-1)feedbackCancel();scFeedback.run=g.run;}
  feedbackClass(modal,'sc-earned-win',1050);
  if(feedbackReduced())return;
  const origin=feedbackCenter(modal.querySelector('.modal-art'))||feedbackCenter(modal.querySelector('h2'));if(!origin)return;
  const group=feedbackGroup(g),colors=['#ff8b7b','#f9c75e','#67c6a6','#66becf'];
  for(let j=0;j<9;j++){
    const angle=(208+j*15)*Math.PI/180,radius=35+(j%3)*15;
    feedbackParticle(group,'sc-win-spark'+(j%3===0?' sc-star':''),origin.x,origin.y,{
      '--fx-color':colors[j%4],'--fx-x':Math.cos(angle)*radius+'px','--fx-y':Math.sin(angle)*radius-18+'px','--fx-turn':(j%2?160:-160)+'deg','--fx-delay':j%4*35+'ms'
    });
  }
}
function feedbackSound(kind='pop',chain){
  if(document.hidden||(typeof save!=='undefined'&&save.muted))return;
  try{
    const AudioType=window.AudioContext||window.webkitAudioContext;if(!AudioType)return;
    const ctx=scFeedback.audio||(scFeedback.audio=new AudioType());if(ctx.state==='suspended')ctx.resume()?.catch(()=>{});
    const now=ctx.currentTime,last=scFeedback.lastSound[kind]??-10;
    const gap=(kind==='power'||kind==='crystal') ? .1 : .035;
    if(now-last<gap)return;scFeedback.lastSound[kind]=now;
    const note=(frequency,offset,duration=.18,volume=.04,type='triangle')=>{
      if(scFeedback.voices.size>=24)return;
      const o=ctx.createOscillator(),gain=ctx.createGain(),at=now+offset;o.type=type;o.frequency.setValueAtTime(frequency,at);
      gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.008);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
      o.connect(gain);gain.connect(ctx.destination);scFeedback.voices.add(o);
      o.onended=()=>{scFeedback.voices.delete(o);o.disconnect();gain.disconnect();};o.start(at);o.stop(at+duration+.015);
    };
    if(kind==='win'){
      [523.25,659.25,783.99,659.25,783.99,1046.5].forEach((f,i)=>note(f,i*.105,i===5?.38:.2,.026));
      [261.63,329.63,392].forEach(f=>note(f,.48,.5,.009,'sine'));
    }else if(kind==='lose'){
      note(392,0,.22,.023,'sine');note(329.63,.16,.3,.02,'sine');
    }else if(kind==='power'||kind==='crystal'){
      [392,523.25,659.25,783.99].forEach((f,i)=>note(f,i*.048,.2,.03));note(196,0,.25,.024,'sine');
    }else if(kind==='swap'){
      note(440,0,.075,.018,'sine');note(523.25,.04,.075,.014,'sine');
    }else{
      const step=Math.min(5,Math.max(0,(chain??state.game?.chain??1)-1)),scale=[392,440,523.25,587.33,659.25,783.99];
      note(scale[step],0,.13,.032);note(scale[step]*2,0,.07,.006,'sine');
    }
  }catch{} // A muted or unavailable audio device never interferes with play.
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)feedbackCancel();});
/* FEEDBACK_END */

window.SugarClash={encounterConfig,makeRestoration,restorationStep,restorationTargets,campaignWon,makeBoard,runGroups,matchedCells,legalMoves,powerCreation,expandEffects,gravity,reshuffle,canCombine,newPiece,levelConfig,normalizeSave,defaultSave,getState:()=>state,getSave:()=>save,requestLevel,tryStartLevel,attemptSwap,chooseCell,launchMode};
syncLives();renderNav();updateResources();renderHome();
setInterval(()=>{if(document.hidden)return;const before=save.lives;syncLives();if(before!==save.lives)persistSave();else if(state.screen!=='game'&&state.screen!=='arena')updateResources();},15000);
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).catch(()=>{}));
